name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests and package
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - name: Check assistant evaluation runner without network requests
        run: python3 -m unittest discover -s scripts -p test_evaluate_assistant.py
      - name: Check production smoke runner without network requests
        run: python3 -m unittest discover -s scripts -p test_smoke_production.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Run chart regression tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check dependency advisories
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser regressions
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  mysql:
    name: MySQL persistence tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: aurora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uroot -pci-only-password -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify migrations, readback and retention against MySQL
        working-directory: backend
        env:
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/aurora_ci?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ci-only-password
        run: ./mvnw --batch-mode -Dtest=JdbcRunRecordStoreTest test
      - name: Verify backup and restore in an isolated MySQL container
        timeout-minutes: 5
        run: bash scripts/check_mysql_restore.sh
