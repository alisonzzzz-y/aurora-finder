spring.application.name=aurora-finder
server.port=8080
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.geocoding.enabled=true
app.geocoding.base-url=https://geocoding-api.open-meteo.com/v1
app.http.connect-timeout=3s
app.geocoding.request-timeout=8s
app.geocoding.cache.max-entries=256
app.geocoding.cache.search-ttl=10m
app.geocoding.cache.location-ttl=1h
app.geocoding.rate-limit.per-minute=500
app.geocoding.rate-limit.per-hour=4500
app.geocoding.rate-limit.per-day=9000
app.ovation.data-url=https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
app.ovation.request-timeout=10s
app.noaa-kp.data-url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json
app.noaa-kp.request-timeout=10s
app.metno.base-url=https://api.met.no/weatherapi/locationforecast/2.0/compact
app.metno.request-timeout=10s
app.metno.user-agent=${METNO_USER_AGENT:AuroraFinder/0.1 (https://github.com/alisonzzzz-y/aurora-observation-agent; alison.zhangyan@gmail.com)}
app.metno.cache.max-entries=256
app.metno.cache.default-ttl=15m
