spring.application.name=observation-agent
server.port=8080
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
app.geocoding.enabled=true
app.geocoding.base-url=https://geocoding-api.open-meteo.com/v1
app.http.connect-timeout=3s
app.geocoding.request-timeout=8s
app.ovation.data-url=https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
app.ovation.request-timeout=10s
app.metno.user-agent=${METNO_USER_AGENT:AuroraOutlook/0.1 alison.zhangyan@gmail.com}
