spring.application.name=aurora-finder
server.port=${PORT:8080}
server.address=0.0.0.0
# Do not trust client-supplied forwarding headers for AI rate limiting.
server.forward-headers-strategy=none
app.run-record.enabled=${APP_RUN_RECORD_ENABLED:false}
app.run-record.jdbc-url=${APP_RUN_RECORD_JDBC_URL:}
app.run-record.username=${APP_RUN_RECORD_USERNAME:}
app.run-record.password=${APP_RUN_RECORD_PASSWORD:}
app.run-record.retention-days=${APP_RUN_RECORD_RETENTION_DAYS:7}
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.geocoding.enabled=true
app.geocoding.base-url=https://geocoding-api.open-meteo.com/v1
app.http.connect-timeout=3s
app.geocoding.request-timeout=8s
app.geocoding.cache.max-entries=256
app.geocoding.cache.search-ttl=10m
app.geocoding.cache.location-ttl=1h
app.geocoding.rate-limit.per-minute=500
app.geocoding.rate-limit.per-hour=4500
app.geocoding.rate-limit.per-day=9000
app.ovation.data-url=https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
app.ovation.request-timeout=10s
app.noaa-kp.data-url=https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json
app.noaa-kp.request-timeout=10s
app.noaa-geomag.data-url=https://services.swpc.noaa.gov/text/3-day-geomag-forecast.txt
app.noaa-geomag.request-timeout=10s
app.metno.base-url=https://api.met.no/weatherapi/locationforecast/2.0/compact
app.metno.request-timeout=10s
app.metno.user-agent=${METNO_USER_AGENT:AuroraFinder/0.1 (https://github.com/alisonzzzz-y/aurora-finder; alison.zhangyan@gmail.com)}
app.metno.cache.max-entries=256
app.metno.cache.default-ttl=15m
app.noaa-alerts.data-url=https://services.swpc.noaa.gov/products/alerts.json
app.noaa-alerts.request-timeout=10s
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-6-luna}
app.openai.base-url=https://api.openai.com/v1
app.openai.request-timeout=35s
app.assistant.rate-limit.requests=8
app.assistant.rate-limit.window=10m

app.assistant.rate-limit.global-requests=${APP_ASSISTANT_GLOBAL_REQUESTS:24}
app.assistant.max-concurrent=${APP_ASSISTANT_MAX_CONCURRENT:2}

# Background strong-activity alerts (Web Push). Off unless both keys are set; also needs run-record storage.
app.push.vapid-public-key=${APP_PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${APP_PUSH_VAPID_PRIVATE_KEY:}
app.push.subject=${APP_PUSH_SUBJECT:mailto:alison.zhangyan@gmail.com}
